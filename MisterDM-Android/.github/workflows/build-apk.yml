name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME). Do NOT use android-actions/setup-android:
      # it fails with "Failed to find package 'tools'".
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" | tail -n 3

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Summarize errors
        if: failure()
        run: |
          echo "### Compile errors" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          (grep -hE "^e: |error:|FAILED|What went wrong" -A3 build.log test.log 2>/dev/null | head -n 120) >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build.log
            test.log
            app/build/reports/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: NovaPlayer-apk
          path: app/build/outputs/apk/debug/*.apk
